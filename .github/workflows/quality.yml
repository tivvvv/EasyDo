name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 安装Tauri Linux依赖
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm release:check
      - run: pnpm test:coverage
      - run: pnpm build
      - name: 编译端到端测试数据服务
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --features data-service-bin --bin easydo-data-service
      - run: pnpm --filter @easydo/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm desktop:check
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --features data-service-bin
      - run: pnpm --filter @easydo/web exec playwright install chromium
      - run: pnpm --filter @easydo/web exec playwright test e2e/visual.spec.ts
      - name: 保存视觉回归失败现场
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-visual-failure
          path: apps/web/test-results/
          retention-days: 7
